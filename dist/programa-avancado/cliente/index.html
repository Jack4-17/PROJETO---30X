<script>
(()=>{const B="https://resrroueoutftaxwzysg.supabase.co/storage/v1/object/public/30x-programa-avancado-12-semanas/";if(window.PROGRAM_DATA?.workouts){for(const w of window.PROGRAM_DATA.workouts){for(const e of (w.exercises||[])){if(e.image&&!/^https?:/i.test(e.image))e.image=B+e.image.replace(/^\.\//,'')}}}})();
</script>
<script src="https://resrroueoutftaxwzysg.supabase.co/storage/v1/object/public/30x-programa-avancado-12-semanas/script.js"></script>
